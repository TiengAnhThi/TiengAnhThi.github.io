<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAT | Cổng luyện thi tiếng Anh lớp 1–12</title><style>:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#172b4d;background:#f4f7ff}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#2449ba,#7455d9);color:white;padding:24px max(20px,calc((100vw - 1100px)/2));display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.brand{font-size:25px;font-weight:850}.tag{opacity:.9;font-size:14px}main{max-width:1100px;margin:auto;padding:34px 20px}.hero{text-align:center;margin-bottom:30px}h1{font-size:clamp(27px,4vw,42px);margin:0 0 12px}.hero p{color:#586781;margin:0}.toolbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin:28px 0 20px}input{padding:13px 16px;border:1px solid #d7deef;border-radius:12px;font-size:15px;min-width:230px}.filters{display:flex;gap:8px;flex-wrap:wrap}button{cursor:pointer;font:inherit}.filter{border:1px solid #d9e1f2;background:white;border-radius:30px;padding:10px 16px;color:#42557a}.filter.active{background:#274fca;color:white;border-color:#274fca}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:18px}.card{background:white;border:1px solid #e3e9f5;border-radius:20px;padding:22px;box-shadow:0 7px 24px #294a8b0d;transition:.2s}.card:hover{transform:translateY(-4px);box-shadow:0 14px 30px #294a8b20}.symbol{font-size:35px}.card h2{margin:12px 0 5px;font-size:23px}.card p{color:#65728b;font-size:14px;min-height:40px}.card button,.back{width:100%;background:#2954d4;color:white;border:0;padding:12px;border-radius:11px;font-weight:700}.level{font-size:12px;color:#5e6da1;background:#edf1ff;border-radius:30px;padding:5px 10px;display:inline-block}.detail{max-width:780px;margin:auto;background:white;border-radius:24px;padding:30px;box-shadow:0 8px 30px #294a8b12}.detail h2{font-size:30px}.modules{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:25px 0}.module{border:1px solid #dce4f5;background:#f8faff;border-radius:14px;padding:20px;text-align:left;color:#23375c}.module strong{display:block;margin-top:8px}.note{background:#fff7e9;border-radius:12px;padding:14px;color:#745421;font-size:14px}.back{width:auto;background:#e9edfa;color:#2745a0;margin-bottom:15px}footer{text-align:center;color:#8090a8;padding:30px}a{color:inherit}@media(max-width:600px){header{padding:20px}.toolbar{align-items:stretch}input{width:100%}.detail{padding:20px}}</style></head><body><header><div class="brand">📘 TAT</div><div class="tag">Tiếng Anh Trực tuyến • Lớp 1–12</div></header><main id="app"></main><footer>TAT • Tiếng Anh Trực tuyến • Cổng luyện thi lớp 1–12</footer><script>const app=document.getElementById('app');const grades=Array.from({length:12},(_,i)=>i+1);const group=n=>n<=5?'Tiểu học':n<=9?'THCS':'THPT';const icons=['🌈','🧸','🎈','🚀','⭐','📚','🎯','🧩','🌍','💡','🏆','🎓'];let filter='Tất cả',query='';function home(){history.replaceState(null,'','#');app.innerHTML=`<section class="hero"><h1>Chào mừng đến với TAT – Chọn lớp để luyện thi tiếng Anh</h1><p>12 khối lớp • 4 cấp thi thử • Luyện tập theo cấp độ</p></section><div class="toolbar"><div class="filters">${['Tất cả','Tiểu học','THCS','THPT'].map(f=>`<button class="filter ${filter===f?'active':''}" data-filter="${f}">${f}</button>`).join('')}</div><input id="search" placeholder="🔎 Tìm lớp học..." value="${query.replace(/"/g,'&quot;')}"></div><div class="grid" id="cards"></div>`;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;home()});document.getElementById('search').oninput=e=>{query=e.target.value;cards()};cards()}function cards(){document.getElementById('cards').innerHTML=grades.filter(n=>(filter==='Tất cả'||group(n)===filter)&&('lớp '+n).includes(query.toLowerCase().trim())).map(n=>`<article class="card"><div class="symbol">${icons[n-1]}</div><h2>Tiếng Anh lớp ${n}</h2><span class="level">${group(n)}</span><p>Luyện thi thử tiếng Anh theo 4 cấp dành cho học sinh lớp ${n}.</p><button data-grade="${n}">Vào thi thử →</button></article>`).join('')||'<p>Không tìm thấy lớp phù hợp.</p>';document.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>{location.hash='lop-'+b.dataset.grade})}function detail(n){app.innerHTML=`<div class="detail"><button class="back" onclick="location.hash=''">← Trở về chọn lớp</button><div style="font-size:48px">${icons[n-1]}</div><h2>Tiếng Anh lớp ${n}</h2><p>Chào mừng đến với trang thi thử tiếng Anh lớp ${n} (${group(n)}).</p><div class="modules">${[['🏫','Thi thử Cấp trường'],['🏘️','Thi thử Cấp xã/phường'],['🏛️','Thi thử Cấp tỉnh'],['🏆','Thi thử Quốc gia']].filter(([icon,title])=>(title!=='Thi thử Cấp xã/phường'||n<=9)&&(title!=='Thi thử Quốc gia'||(n>=3&&n<=11))).map(([icon,title])=>`<button class="module" data-module="${title}"><span style="font-size:30px">${icon}</span><strong>${title}</strong></button>`).join('')}</div><p class="note" id="notice">Chọn một cấp thi để luyện tập. Nội dung đề thi sẽ được bổ sung sau.</p></div>`;document.querySelectorAll('[data-module]').forEach(b=>b.onclick=()=>{if(n===6 && b.dataset.module==='Cấp trường'){window.location.href='./thi-thu/cap-truong/lop-6/';return;}if(n===6 && b.dataset.module==='Cấp xã/phường'){window.location.href='./thi-thu/cap-xa-phuong/lop-6/';return;}document.getElementById('notice').textContent=`Mục Thi thử ${b.dataset.module} lớp ${n} chưa có đề thi. Hãy bổ sung hoặc liên kết trang đề thi HTML cho cấp này.`})}function route(){let m=location.hash.match(/^#lop-(\d+)$/);m&&+m[1]>=1&&+m[1]<=12?detail(+m[1]):home()}window.addEventListener('hashchange',route);route();</script></body></html>
